name: CI

on:
  # Branches are checked through their pull request; a push to one with an
  # open pull request would otherwise run everything twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push to a pull request stops the run for the commit it replaces.
# Runs on main always finish, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Clippy linter
        run: cargo clippy --all-targets --features testing -- -D warnings

      - name: Run tests
        run: cargo test --features testing

      # A build to try by hand: rdm.exe needs rdmd.exe and rdm-nmhost.exe in the same folder.
      - name: Build Windows programs
        if: matrix.os == 'windows-latest'
        run: cargo build --release --bins

      - name: Upload Windows programs
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rdm-windows
          path: |
            target/release/rdm.exe
            target/release/rdmd.exe
            target/release/rdm-nmhost.exe
          if-no-files-found: error
          retention-days: 14

  extension:
    name: Browser extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A glob rather than the folder: it behaves the same on Node 22 and later.
      - name: Run extension tests
        run: node --test "extension/test/*.test.js"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage (80% minimum)
        run: cargo llvm-cov --features testing --fail-under-lines 80
