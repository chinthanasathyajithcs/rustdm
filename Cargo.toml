[package]
name = "rustdm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "rustdm"
path = "src/lib.rs"

[[bin]]
name = "rdm"
path = "src/main.rs"

[[bin]]
name = "rdmd"
path = "src/bin/rdmd.rs"

[features]
testing = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
percent-encoding = "2.3"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

