<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rustdm</title>
  <style>
    /* rustdm's Ember look; the colours come from content/ember.css.js (theme.rs). */
    :root { color-scheme: dark; background: var(--rdm-quit-bg); }
    body { font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--rdm-bright); background: var(--rdm-quit-bg);
      margin: 0; padding: 14px 16px; min-width: 320px; max-width: 480px; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; margin: 0 0 12px; }
    .badge { padding: 1px 6px; border-radius: 3px; background: var(--rdm-amber); color: var(--rdm-on-amber); font-weight: 700; }
    section { margin: 0 0 12px; padding: 0 0 12px; border-bottom: 1px solid var(--rdm-rule); }
    section:last-of-type { border-bottom: 0; }
    label { display: flex; gap: 8px; align-items: center; }
    input[type="checkbox"] { accent-color: var(--rdm-amber); margin: 0; }
    p { margin: 0 0 8px; }
    button { font: inherit; color: var(--rdm-bright); background: var(--rdm-button-bg); border: 1px solid var(--rdm-frame);
      border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    button:hover { border-color: var(--rdm-amber); }
    :focus-visible { outline: 2px solid var(--rdm-amber); outline-offset: 1px; }
    .muted { color: var(--rdm-muted); }
    .error { color: var(--rdm-red); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1><span class="badge">rustdm</span> download manager</h1>

  <section>
    <label><input type="checkbox" id="enabled"> Catch downloads from this browser</label>
  </section>

  <section>
    <label><input type="checkbox" id="videoBar"> Show the Download this video bar</label>
  </section>

  <section id="permission" hidden>
    <p>To catch downloads, rustdm needs to see them on all sites. This is asked once.</p>
    <button type="button" id="grant">Allow on all sites</button>
  </section>

  <section>
    <div id="host" class="muted">Checking rustdm...</div>
  </section>

  <section id="error-box" hidden>
    <strong>Last problem</strong>
    <div id="error" class="error"></div>
  </section>

  <script src="content/ember.css.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
